# docker compose -p "contoso-pay" -f C:/workspace/repos/labs/contoso/contoso-pay/docker-compose.yml up -d
services:

  postgresql:
    image: postgres:18-alpine
    container_name: postgresql
    environment:
      POSTGRES_PASSWORD: pass@word1
    ports:
      - "5333:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 0s
    networks:
      - core_network

  mongodb:
    image: mongo:8
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: passAtword1
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - core_network

volumes:
  postgresql_data:
    name: postgresql_data
  mongodb_data:
    name: mongodb_data

networks:
  core_network:
    name: core_network
    driver: bridge